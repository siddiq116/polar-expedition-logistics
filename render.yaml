services:
  - type: web
    name: polar-expedition-logistics
    env: node
    plan: free
    buildCommand: "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend"
    startCommand: "npm start --prefix backend"
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
